name: Desktop Build (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,desktop]"
          pip install "pyinstaller>=6.0"
      - name: Generate icon
        run: python packaging/windows/make_icon.py
      - name: Build executable
        run: pyinstaller packaging/windows/studyguard.spec --noconfirm
      - name: Portable zip
        run: Compress-Archive -Path dist/StudyGuardAI/* -DestinationPath release/StudyGuardAI-portable.zip -Force
        shell: pwsh
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc packaging/windows/installer.iss
      - name: Checksums
        run: python packaging/windows/make_checksums.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studyguard-windows
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
